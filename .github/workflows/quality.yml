name: Release quality
on:
  pull_request:
  push:
    branches: ['release/**', 'deploy/**']
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: fluo_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: fluo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fluo_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements-dev.txt -r requirements-security.txt -r requirements-vercel.txt
      - run: python -m ruff check backend tools tests
      - run: python -m bandit -r backend -q
      - run: python -m pip_audit -r requirements-vercel.txt
      - run: python -m pytest -q tests/test_public_host_aliases.py
      - run: python -m pytest -q tests/test_guest_security.py -k guest_limits_cleanup_and_persistence
      - run: python -m pytest -q tests/test_postgres.py -k without_research_files
        env:
          FLUO_TEST_POSTGRES_URL: postgresql://fluo_ci:disposable_ci_only@127.0.0.1:5432/fluo_ci
      - run: python tools/security_inventory.py
      - run: npm ci && npm run typecheck && npm run lint && npm test && npm run build && npm audit
        working-directory: web
      # Full model/API/browser release suites require the private audited runtime
      # packet and reviewed local visual baselines. No secrets are exposed to PRs.
