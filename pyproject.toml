[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:X has feature names, but HistGradientBoostingClassifier was fitted without feature names:UserWarning"]

[tool.ruff]
target-version = "py312"
line-length = 140
include = ["backend/**/*.py", "tests/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
