[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:X has feature names, but HistGradientBoostingClassifier was fitted without feature names:UserWarning"]

[tool.ruff]
target-version = "py312"
line-length = 140
include = ["backend/**/*.py", "tests/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[project]
name = "fluo-serverless-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.15.1",
  "charset-normalizer==3.5.2",
  "click==8.5.0",
  "fastapi==0.162.0",
  "h11==0.16.0",
  "idna==3.20",
  "joblib==1.5.2",
  "numpy==2.3.5",
  "opentelemetry-api==1.45.1",
  "pandas==2.2.3",
  "pillow==13.0.0",
  "pydantic==2.14.1",
  "pydantic_core==2.50.1",
  "python-dateutil==2.9.0.post0",
  "pytz==2026.5",
  "reportlab==4.4.9",
  "scikit-learn==1.8.0",
  "scipy==1.16.3",
  "six==1.17.0",
  "starlette==1.10.0",
  "threadpoolctl==3.7.0",
  "typing-inspection==0.4.4",
  "typing_extensions==4.16.0",
  "tzdata==2026.5",
  "uvicorn==0.54.0",
  "psycopg==3.3.6",
  "psycopg-binary==3.3.6",
  "psycopg-pool==3.3.3",
  "certifi==2026.10.19",
]

[tool.vercel]
entrypoint = "server:app"

[tool.vercel.fastapi.static]
cdn = false
